server.port=${PORT:8080}

# ---- MySQL (override with environment variables when deploying) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates/updates tables automatically
spring.jpa.hibernate.ddl-auto=update

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-chars}
app.jwt.expiration-ms=86400000

app.admin.password=${ADMIN_PASSWORD:admin123}


        app.ai.key=${GEMINI_API_KEY:}
   app.ai.model=${AI_MODEL:gemini-3.1-flash-lite}

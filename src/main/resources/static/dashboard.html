<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizMaster - Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <h2>Choose a quiz</h2>
    <div id="quizList" class="grid"></div>

    <div class="section two-col">
      <div>
        <h2>Your recent attempts</h2>
        <div class="card" id="history"></div>
      </div>
      <div>
        <h2>Top scorers</h2>
        <div class="card" id="board"></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
